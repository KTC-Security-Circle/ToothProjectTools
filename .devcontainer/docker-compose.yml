services:
  structured-service:
    build:
      context: .
      dockerfile: Dockerfile

    user: "vscode"
    group_add: 
      - "${VIDEO_GID}"

    # GUI（X11）
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Xauthority を使う場合（推奨／ホストで `xhost +SI:localuser:${USER}` 等）
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro

      # ソースと ccache を永続化
      - ../:/workspace
      - ccache:/opt/ccache

    # 明示的にデバイスを渡す
    devices:
      - /dev/video0:/dev/video0
      - /dev/video2:/dev/video2
      # - /dev/video4:/dev/video4
      # - /dev/video6:/dev/video6
      - /dev/dri:/dev/dri

    cap_add:
      - SYS_PTRACE

    tmpfs:
      - /tmp/runtime-vscode:rw,mode=777

    tty: true
    stdin_open: true
    network_mode: host
    ipc: host
    hostname: localhost
    working_dir: /workspace

volumes:
  ccache:
